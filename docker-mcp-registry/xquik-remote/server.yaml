name: xquik-remote
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - social-media
    - twitter
    - x
    - remote
about:
  title: Xquik
  description: Search, export, monitor, and publish public X/Twitter data through a hosted MCP server. Not affiliated with X Corp.
  icon: https://www.google.com/s2/favicons?domain=xquik.com&sz=64
remote:
  transport_type: streamable-http
  url: https://xquik.com/mcp
oauth:
  - provider: xquik-remote
    secret: xquik-remote.personal_access_token
    env: XQUIK_REMOTE_PERSONAL_ACCESS_TOKEN
