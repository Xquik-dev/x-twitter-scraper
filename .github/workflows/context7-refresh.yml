name: Refresh Context7 documentation

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/context7-refresh.yml"
      - "README.md"
      - "commands/**"
      - "context7.json"
      - "skills/**"
      - "skills.sh.json"
      - "task-guides/**"
      - "package.json"
  workflow_dispatch:

permissions: {}

concurrency:
  group: x-developer-context7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh Context7 library
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger Context7 refresh
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$CONTEXT7_API_KEY" ]; then
            echo "::error ::CONTEXT7_API_KEY is missing. Configure the repository secret."
            exit 1
          fi

          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          status="$(curl --connect-timeout 10 --max-time 30 --proto '=https' -sS --tlsv1.2 -o "$body_file" -w "%{http_code}" -X POST "https://context7.com/api/v1/refresh" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CONTEXT7_API_KEY}" \
            -d '{"libraryName": "/xquik-dev/x-twitter-scraper"}')"

          case "$status" in
            200|202)
              cat "$body_file"
              ;;
            400)
              if grep -Eiq "active-task|being processed|already.*process" "$body_file"; then
                echo "::warning ::Context7 is processing another library. Retry after the next documentation change."
                cat "$body_file"
              elif grep -Eiq "too-early|minimum .* days|required between updates" "$body_file"; then
                echo "::warning ::Context7 refresh is not due yet."
                cat "$body_file"
              else
                echo "::error ::Context7 returned HTTP $status during refresh."
                cat "$body_file"
                exit 1
              fi
              ;;
            404)
              echo "::warning ::Context7 has not listed /xquik-dev/x-twitter-scraper yet."
              cat "$body_file"
              ;;
            401|403)
              echo "::error ::Context7 authentication failed."
              exit 1
              ;;
            *)
              echo "::error ::Context7 returned HTTP $status during refresh."
              cat "$body_file"
              exit 1
              ;;
          esac
