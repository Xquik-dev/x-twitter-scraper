name: Publish to the MCP Registry

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: mcp-registry-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified MCP metadata
    if: github.repository == 'Xquik-dev/x-twitter-scraper'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: mcp-registry
    permissions:
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.0
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Verify release context
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: .github/scripts/verify-release-context.sh

      - name: Check the MCP Registry
        id: registry
        run: |
          server_name="$(bun -e "process.stdout.write(encodeURIComponent(require('./server.json').name))")"
          server_version="$(bun -e "process.stdout.write(require('./server.json').version)")"
          registry_url="https://registry.modelcontextprotocol.io/v0.1/servers/${server_name}/versions/${server_version}"
          registry_status="$(curl --location --silent --show-error --retry 3 \
            --output /dev/null --write-out "%{http_code}" "$registry_url")"

          case "$registry_status" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "The MCP Registry returned HTTP ${registry_status}." >&2
              exit 1
              ;;
          esac

      - name: Wait for the package release
        if: steps.registry.outputs.published != 'true'
        run: |
          package_name="$(bun -e "process.stdout.write(require('./package.json').name)")"
          package_version="$(bun -e "process.stdout.write(require('./package.json').version)")"
          for _ in {1..30}; do
            published_version="$(bun pm view "${package_name}@${package_version}" version 2>/dev/null || true)"
            if [[ "$published_version" == "$package_version" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "The matching package was not available after 5 minutes." >&2
          exit 1

      - name: Install mcp-publisher
        if: steps.registry.outputs.published != 'true'
        run: |
          asset="mcp-publisher_linux_amd64.tar.gz"
          checksum="1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf"
          curl --fail --location --show-error --silent --retry 3 \
            --output "$asset" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${asset}"
          printf "%s  %s\n" "$checksum" "$asset" | sha256sum --check --strict
          tar xzf "$asset" mcp-publisher

      - name: Validate server.json
        if: steps.registry.outputs.published != 'true'
        run: ./mcp-publisher validate

      - name: Authenticate to the MCP Registry
        if: steps.registry.outputs.published != 'true'
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          ./mcp-publisher login http \
            --domain xquik.com \
            --private-key "$MCP_REGISTRY_PRIVATE_KEY"

      - name: Publish to the MCP Registry
        if: steps.registry.outputs.published != 'true'
        run: ./mcp-publisher publish
