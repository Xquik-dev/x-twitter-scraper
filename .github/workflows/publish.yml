name: Publish package

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified package
    if: github.repository == 'Xquik-dev/x-twitter-scraper'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check license metadata
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Verify release context
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: .github/scripts/verify-release-context.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Check reproducible package
        run: bun run check:reproducible

      - name: Inspect package contents
        run: bun pm pack --dry-run --ignore-scripts

      - name: Check npm registry
        id: registry
        run: |
          package_name="$(bun -e "process.stdout.write(require('./package.json').name)")"
          package_version="$(bun -e "process.stdout.write(require('./package.json').version)")"
          if bun pm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.registry.outputs.published != 'true'
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish

  release:
    name: Create GitHub release
    needs: publish
    if: github.repository == 'Xquik-dev/x-twitter-scraper'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Create the verified tag's GitHub release.
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          notice='Xquik is an independent third-party service. Not affiliated with X Corp. "Twitter" and "X" are trademarks of X Corp.'
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG_NAME" \
            --notes "$notice"
